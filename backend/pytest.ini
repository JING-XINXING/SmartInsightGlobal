[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 添加标记
# 默认跳过需要外网或真实 Redis 的 integration 用例。
# 覆盖率门槛放到 V1.9 再升到 70，避免在补齐测试前阻断提交。
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    -m "not integration"
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

norecursedirs = manual .git __pycache__ .venv venv

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试

# 异步测试配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 最小测试覆盖率要求
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */venv/*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == "__main__":